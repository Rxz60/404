<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP | بحث سكربتات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
--orange:#ff6900;
--orange2:#ff9d22;
--bg:#050505;
--card:#0d0d0d;
--text:#fff;
--muted:#777;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
color:var(--text);
font-family:Inter,Arial,sans-serif;
background:
linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.94)),
url("https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(circle at 50% 0%,rgba(255,106,0,.2),transparent 35%);
}

nav{
height:74px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
position:sticky;
top:0;
z-index:20;
background:rgba(3,3,3,.82);
border-bottom:1px solid rgba(255,106,0,.15);
backdrop-filter:blur(18px);
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{
color:var(--orange);
}

.status{
display:flex;
align-items:center;
gap:8px;
font-size:10px;
color:#777;
font-weight:700;
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#45ff83;
box-shadow:0 0 12px #45ff83;
}

.hero{
min-height:430px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:60px 20px 40px;
}

.badge{
padding:8px 14px;
border:1px solid rgba(255,106,0,.3);
border-radius:999px;
color:#ffad63;
background:rgba(255,106,0,.08);
font-size:10px;
font-weight:800;
margin-bottom:20px;
}

h1{
font-size:clamp(48px,9vw,90px);
font-weight:900;
letter-spacing:-5px;
line-height:.95;
margin-bottom:20px;
}

h1 span{
color:var(--orange);
}

.hero p{
color:#858585;
font-size:13px;
margin-bottom:30px;
}

.search{
width:min(760px,95vw);
display:flex;
align-items:center;
padding:7px;
background:rgba(8,8,8,.9);
border:1px solid rgba(255,106,0,.28);
border-radius:17px;
box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.search-icon{
width:45px;
font-size:22px;
color:#777;
}

.search input{
flex:1;
min-width:0;
height:50px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-family:inherit;
font-size:14px;
}

.search input::placeholder{
color:#5f5f5f;
}

.search button{
height:50px;
padding:0 24px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,var(--orange2),var(--orange));
color:#000;
font-family:inherit;
font-weight:900;
font-size:11px;
cursor:pointer;
}

.container{
width:min(1250px,92%);
margin:auto;
}

.toolbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:22px;
}

.title{
font-size:19px;
font-weight:900;
}

.count{
margin-top:5px;
color:#666;
font-size:10px;
}

.filters{
display:flex;
gap:6px;
padding:5px;
background:rgba(8,8,8,.8);
border:1px solid rgba(255,255,255,.07);
border-radius:13px;
overflow-x:auto;
}

.filter{
height:34px;
padding:0 13px;
border:0;
border-radius:9px;
background:transparent;
color:#777;
font-family:inherit;
font-size:9px;
font-weight:900;
cursor:pointer;
white-space:nowrap;
}

.filter:hover{
color:#fff;
background:rgba(255,255,255,.05);
}

.filter.active{
background:linear-gradient(135deg,var(--orange2),var(--orange));
color:#000;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:18px;
padding-bottom:80px;
}

.card{
overflow:hidden;
border:1px solid rgba(255,255,255,.07);
border-radius:18px;
background:linear-gradient(145deg,rgba(20,20,20,.95),rgba(7,7,7,.95));
transition:.25s;
animation:show .4s ease both;
}

.card:hover{
transform:translateY(-7px);
border-color:rgba(255,106,0,.45);
box-shadow:0 25px 55px rgba(0,0,0,.6),0 0 35px rgba(255,106,0,.08);
}

@keyframes show{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:translateY(0)}
}

.image{
position:relative;
width:100%;
aspect-ratio:16/9;
overflow:hidden;
background:#111;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.5s;
}

.card:hover .image img{
transform:scale(1.06);
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.85),transparent 65%);
}

.tags{
position:absolute;
top:12px;
left:12px;
display:flex;
gap:5px;
flex-wrap:wrap;
}

.tag{
padding:6px 9px;
border-radius:7px;
font-size:8px;
font-weight:900;
backdrop-filter:blur(10px);
}

.free{
color:#8dffb0;
background:rgba(35,170,75,.17);
}

.key{
color:#ffd477;
background:rgba(255,170,0,.15);
}

.verified{
color:#80ffa8;
background:rgba(30,170,75,.15);
}

.patched{
color:#ff8b8b;
background:rgba(255,40,40,.14);
}

.body{
padding:17px;
}

.script-title{
font-size:15px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:13px;
}

.game{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.game img{
width:40px;
height:40px;
border-radius:10px;
object-fit:cover;
background:#191919;
}

.game-name{
min-width:0;
}

.game-label{
color:#555;
font-size:8px;
font-weight:800;
margin-bottom:3px;
}

.game-text{
color:#c8c8c8;
font-size:11px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.footer{
display:flex;
align-items:center;
justify-content:space-between;
padding-top:13px;
border-top:1px solid rgba(255,255,255,.06);
}

.views{
color:#777;
font-size:10px;
}

.view{
padding:8px 12px;
border:1px solid rgba(255,106,0,.22);
border-radius:9px;
background:rgba(255,106,0,.07);
color:#ff994a;
font-family:inherit;
font-size:9px;
font-weight:800;
cursor:pointer;
}

.view:hover{
background:var(--orange);
color:#000;
}

.loading{
display:none;
min-height:300px;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
color:#777;
font-size:11px;
}

.spinner{
width:40px;
height:40px;
border:3px solid rgba(255,106,0,.12);
border-top-color:var(--orange);
border-radius:50%;
animation:spin .7s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.empty{
display:none;
min-height:300px;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.empty-icon{
font-size:43px;
margin-bottom:14px;
}

.empty h2{
font-size:19px;
margin-bottom:7px;
}

.empty p{
color:#666;
font-size:11px;
}

.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.86);
backdrop-filter:blur(15px);
z-index:100;
}

.modal.active{
display:flex;
}

.modal-box{
width:min(850px,96vw);
max-height:90vh;
overflow:hidden;
background:#090909;
border:1px solid rgba(255,106,0,.3);
border-radius:20px;
box-shadow:0 30px 100px rgba(0,0,0,.8);
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 20px;
border-bottom:1px solid rgba(255,255,255,.07);
}

.modal-title{
font-size:16px;
font-weight:800;
}

.close{
width:34px;
height:34px;
border:0;
border-radius:9px;
background:#151515;
color:#aaa;
cursor:pointer;
}

.code{
max-height:55vh;
overflow:auto;
margin:20px;
padding:18px;
border:1px solid rgba(255,255,255,.06);
border-radius:12px;
background:#050505;
color:#ddd;
font-family:monospace;
font-size:12px;
line-height:1.65;
white-space:pre-wrap;
word-break:break-word;
}

.actions{
display:flex;
gap:10px;
padding:0 20px 20px;
}

.copy,.open{
height:45px;
border-radius:10px;
font-family:inherit;
font-weight:900;
cursor:pointer;
}

.copy{
flex:1;
border:0;
background:linear-gradient(135deg,#ffad24,#ff6100);
color:#000;
}

.open{
padding:0 20px;
border:1px solid rgba(255,106,0,.2);
background:rgba(255,106,0,.07);
color:#ff9948;
}

footer{
padding:25px 20px 35px;
text-align:center;
border-top:1px solid rgba(255,255,255,.06);
color:#555;
font-size:10px;
}

footer span{
color:#ff7927;
}

@media(max-width:800px){
.toolbar{
align-items:flex-start;
flex-direction:column;
}
.filters{
width:100%;
}
}

@media(max-width:600px){
nav{
padding:0 20px;
}
.status{
display:none;
}
.hero{
min-height:410px;
}
h1{
letter-spacing:-3px;
}
.search button{
padding:0 16px;
}
.grid{
grid-template-columns:1fr;
}
.actions{
flex-direction:column;
}
.open{
width:100%;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">SA<span>P</span></div>
<div class="status"><div class="dot"></div>API ONLINE</div>
</nav>

<section class="hero">
<div class="badge">⚡ ROBLOX SCRIPT SEARCH</div>
<h1>SAP <span>Scripts</span></h1>
<p>بحث سكربتات روبلوكس</p>

<form class="search" id="searchForm">
<div class="search-icon">⌕</div>
<input id="searchInput" type="text" autocomplete="off" placeholder="اكتب اسم الماب أو السكربت...">
<button type="submit">بحث</button>
</form>
</section>

<main class="container">

<div class="toolbar">
<div>
<div class="title" id="resultTitle">السكربتات</div>
<div class="count" id="resultCount">جاري التحميل...</div>
</div>

<div class="filters">
<button class="filter active" data-filter="all">ALL</button>
<button class="filter" data-filter="free">FREE</button>
<button class="filter" data-filter="key">KEY</button>
<button class="filter" data-filter="verified">VERIFIED</button>
<button class="filter" data-filter="patched">PATCHED</button>
</div>
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
جاري البحث...
</div>

<div class="empty" id="empty">
<div class="empty-icon">☠️</div>
<h2 id="emptyTitle">لا توجد سكربتات</h2>
<p id="emptyText">جرب اسم ماب آخر</p>
</div>

<div class="grid" id="results"></div>

</main>

<div class="modal" id="modal">
<div class="modal-box">

<div class="modal-head">
<div class="modal-title" id="modalTitle">Script</div>
<button class="close" id="close">✕</button>
</div>

<pre class="code" id="code"></pre>

<div class="actions">
<button class="copy" id="copy">COPY SCRIPT</button>
<button class="open" id="open">OPEN SCRIPTBLOX</button>
</div>

</div>
</div>

<footer>
Powered by <span>ScriptBlox.com</span>
</footer>

<script>
const API="https://scriptblox.com/api/script/search";
const FALLBACK="https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg";

const results=document.getElementById("results");
const loading=document.getElementById("loading");
const empty=document.getElementById("empty");
const emptyTitle=document.getElementById("emptyTitle");
const emptyText=document.getElementById("emptyText");
const count=document.getElementById("resultCount");
const title=document.getElementById("resultTitle");
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const code=document.getElementById("code");
const copy=document.getElementById("copy");
const open=document.getElementById("open");
const close=document.getElementById("close");

let scripts=[];
let filter="all";
let current="";

const safe=x=>String(x??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));

const views=x=>{
x=Number(x||0);
return x>=1000000?(x/1000000).toFixed(1)+"M":x>=1000?(x/1000).toFixed(1)+"K":x;
};

const hasKey=x=>x.key===true||x.key==="true"||x.hasKey===true||x.hasKey==="true";
const verified=x=>x.verified===true||x.verified==="true";
const patched=x=>x.isPatched===true||x.isPatched==="true"||x.patched===true||x.patched==="true";

function match(x){
if(filter==="free")return !hasKey(x);
if(filter==="key")return hasKey(x);
if(filter==="verified")return verified(x);
if(filter==="patched")return patched(x);
return true;
}

function tags(x){
let t=hasKey(x)?'<span class="tag key">🔑 KEY</span>':'<span class="tag free">✓ FREE</span>';
if(verified(x))t+='<span class="tag verified">✓ VERIFIED</span>';
if(patched(x))t+='<span class="tag patched">PATCHED</span>';
return t;
}

function render(){
results.innerHTML="";
const list=scripts.filter(match);

if(!list.length){
empty.style.display="flex";
emptyTitle.textContent=filter==="all"?"لا توجد سكربتات":`لا توجد سكربتات ${filter}`;
emptyText.textContent="جرب فلتر أو بحث آخر";
count.textContent="0 نتائج";
return;
}

empty.style.display="none";
count.textContent=`${list.length} نتائج`;

list.forEach((x,i)=>{
const game=x.game||{};
const image=x.image||FALLBACK;
const gameImage=game.imageUrl||image;

const card=document.createElement("article");
card.className="card";
card.style.animationDelay=`${Math.min(i*35,350)}ms`;

card.innerHTML=`
<div class="image">
<img src="${safe(image)}" loading="lazy">
<div class="overlay"></div>
<div class="tags">${tags(x)}</div>
</div>
<div class="body">
<div class="script-title">${safe(x.title||"Untitled Script")}</div>
<div class="game">
<img src="${safe(gameImage)}" loading="lazy">
<div class="game-name">
<div class="game-label">GAME</div>
<div class="game-text">${safe(game.name||"Universal")}</div>
</div>
</div>
<div class="footer">
<div class="views">◉ ${views(x.views)} views</div>
<button class="view">VIEW SCRIPT</button>
</div>
</div>
`;

card.querySelectorAll("img").forEach(img=>{
img.onerror=()=>{
img.onerror=null;
img.src=FALLBACK;
};
});

card.querySelector(".view").onclick=()=>{
current=x.script||"";
modalTitle.textContent=x.title||"Script";
code.textContent=current||"لا يوجد كود متاح لهذا السكربت";

open.style.display=x.slug?"block":"none";

if(x.slug){
open.onclick=()=>{
window.open("https://scriptblox.com/script/"+encodeURIComponent(x.slug),"_blank");
};
}

modal.classList.add("active");
};

results.appendChild(card);
});
}

async function load(q=""){
results.innerHTML="";
empty.style.display="none";
loading.style.display="flex";
count.textContent="جاري البحث...";

try{
const url=API+"?q="+encodeURIComponent(q.trim()||"roblox")+"&max=20";
const response=await fetch(url);

if(!response.ok)throw new Error("API");

const data=await response.json();
scripts=data?.result?.scripts||[];

loading.style.display="none";
title.textContent=q.trim()?`نتائج: ${q.trim()}`:"السكربتات";
render();
}catch(e){
loading.style.display="none";
empty.style.display="flex";
emptyTitle.textContent="تعذر تحميل السكربتات";
emptyText.textContent="حاول مرة أخرى";
count.textContent="API Error";
}
}

form.onsubmit=e=>{
e.preventDefault();
const q=input.value.trim();
if(!q)return;
filter="all";
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
document.querySelector('[data-filter="all"]').classList.add("active");
load(q);
};

document.querySelectorAll(".filter").forEach(x=>{
x.onclick=()=>{
document.querySelectorAll(".filter").forEach(y=>y.classList.remove("active"));
x.classList.add("active");
filter=x.dataset.filter;
render();
};
});

close.onclick=()=>{
modal.classList.remove("active");
};

modal.onclick=e=>{
if(e.target===modal)modal.classList.remove("active");
};

document.onkeydown=e=>{
if(e.key==="Escape")modal.classList.remove("active");
};

copy.onclick=async()=>{
if(!current)return;

try{
await navigator.clipboard.writeText(current);
copy.textContent="✓ COPIED";
}catch{
const area=document.createElement("textarea");
area.value=current;
document.body.appendChild(area);
area.select();
document.execCommand("copy");
area.remove();
copy.textContent="✓ COPIED";
}

setTimeout(()=>{
copy.textContent="COPY SCRIPT";
},1500);
};

load();
</script>

</body>
</html>
