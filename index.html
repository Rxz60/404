<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Replacer</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
padding:25px;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
background:#0b0b0b;
border:1px solid #202020;
border-radius:20px;
padding:25px;
box-shadow:0 0 50px rgba(0,0,0,.6);
}

h1{
text-align:center;
font-size:30px;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

.drop{
height:130px;
border:2px dashed #303030;
border-radius:16px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:.2s;
margin-bottom:15px;
}

.drop:hover{
background:#111;
border-color:#666;
}

.drop span{
font-size:38px;
margin-bottom:8px;
}

.drop p{
color:#999;
font-size:14px;
}

textarea{
display:block;
width:100%;
height:520px;
min-height:300px;
resize:vertical;
background:#050505;
border:1px solid #292929;
border-radius:15px;
color:#fff;
padding:18px;
font-family:Consolas,"Courier New",monospace;
font-size:14px;
line-height:1.6;
outline:none;
direction:ltr;
text-align:left;
tab-size:4;
white-space:pre;
overflow:auto;
}

textarea:focus{
border-color:#555;
}

.info{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:10px 0 18px;
color:#777;
font-size:13px;
direction:rtl;
}

.section{
background:#111;
border:1px solid #222;
border-radius:16px;
padding:18px;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.inputs{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input{
width:100%;
height:50px;
background:#070707;
border:1px solid #292929;
border-radius:12px;
padding:0 15px;
color:#fff;
font-size:14px;
outline:none;
}

input:focus{
border-color:#555;
}

button{
width:100%;
height:50px;
border:0;
border-radius:12px;
margin-top:14px;
background:#fff;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#ddd;
transform:translateY(-1px);
}

.download{
background:#151515;
border:1px solid #292929;
color:#fff;
}

.clear{
background:#0b0b0b;
border:1px solid #292929;
color:#aaa;
}

.result{
display:none;
margin-top:20px;
}

.result textarea{
height:520px;
}

.status{
margin-top:12px;
text-align:center;
color:#888;
font-size:13px;
}

@media(max-width:700px){

body{
padding:12px;
}

.container{
padding:15px;
}

.inputs{
grid-template-columns:1fr;
}

textarea{
height:400px;
font-size:13px;
}

.result textarea{
height:400px;
}

h1{
font-size:25px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>Code Replacer</h1>

<div class="subtitle">
استبدال أي كلمة داخل الكود أو الملف
</div>

<label class="drop" for="fileInput">

<span>📁</span>

<p>اضغط هنا لرفع ملف الكود</p>

<input id="fileInput" type="file" hidden>

</label>

<textarea id="code" spellcheck="false" placeholder="الصق الكود هنا..."></textarea>

<div class="info">

<span id="lineCount">الأسطر: 0</span>

<span id="charCount">الأحرف: 0</span>

</div>

<div class="section">

<div class="title">
استبدال كود
</div>

<div class="inputs">

<input id="oldWord" type="text" placeholder="الكلمة الموجودة">

<input id="newWord" type="text" placeholder="الكلمة الجديدة">

</div>

<button id="replace">
استبدال الكلمة
</button>

<button class="clear" id="clear">
مسح
</button>

</div>

<div class="result" id="result">

<div class="title">
الكود بعد الاستبدال
</div>

<textarea id="output" spellcheck="false" readonly></textarea>

<div class="info">

<span id="resultLines">الأسطر: 0</span>

<span id="replaceCount">تم الاستبدال: 0</span>

</div>

<button class="download" id="download">
تحميل الملف
</button>

<div class="status" id="status"></div>

</div>

</div>

<script>
const fileInput=document.getElementById("fileInput");
const code=document.getElementById("code");
const oldWord=document.getElementById("oldWord");
const newWord=document.getElementById("newWord");
const replace=document.getElementById("replace");
const clear=document.getElementById("clear");
const output=document.getElementById("output");
const result=document.getElementById("result");
const download=document.getElementById("download");
const lineCount=document.getElementById("lineCount");
const charCount=document.getElementById("charCount");
const resultLines=document.getElementById("resultLines");
const replaceCount=document.getElementById("replaceCount");
const status=document.getElementById("status");

let selectedFileName="replaced-code.txt";
let selectedFileType="text/plain";

fileInput.addEventListener("change",function(){

const file=fileInput.files[0];

if(!file){
return;
}

selectedFileName=file.name;
selectedFileType=file.type||"text/plain";

const reader=new FileReader();

reader.onload=function(){

code.value=reader.result;

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

status.textContent="تم تحميل الملف: "+file.name;

};

reader.readAsText(file);

});

code.addEventListener("input",function(){

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

});

replace.addEventListener("click",function(){

const source=code.value;
const oldValue=oldWord.value;
const newValue=newWord.value;

if(!source){
alert("الصق الكود أو ارفع ملف أولاً");
return;
}

if(!oldValue){
alert("اكتب الكلمة التي تريد استبدالها");
return;
}

const parts=source.split(oldValue);
const total=parts.length-1;

output.value=parts.join(newValue);

result.style.display="block";

resultLines.textContent="الأسطر: "+(output.value.length?output.value.split(/\r\n|\r|\n/).length:0);

replaceCount.textContent="تم الاستبدال: "+total;

status.textContent=total+" ظهور تم استبداله";

output.scrollTop=0;

});

clear.addEventListener("click",function(){

code.value="";
output.value="";
oldWord.value="";
newWord.value="";
fileInput.value="";
result.style.display="none";

lineCount.textContent="الأسطر: 0";
charCount.textContent="الأحرف: 0";
resultLines.textContent="الأسطر: 0";
replaceCount.textContent="تم الاستبدال: 0";
status.textContent="";

selectedFileName="replaced-code.txt";
selectedFileType="text/plain";

});

download.addEventListener("click",function(){

const blob=new Blob([output.value],{
type:selectedFileType+";charset=utf-8"
});

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;
link.download=selectedFileName;

document.body.appendChild(link);
link.click();
document.body.removeChild(link);

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

status.textContent="تم تجهيز الملف للتحميل";

});
</script>

</body>
</html>
