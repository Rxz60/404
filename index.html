<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAP - بحث سكربتات</title>

<meta name="description" content="موقع SAP + موثوق">

<meta property="og:title" content="SAP">
<meta property="og:description" content="موقع SAP + موثوق">
<meta property="og:image" content="https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg">
<meta property="og:type" content="website">

<meta name="theme-color" content="#ff5a00">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Cairo",sans-serif;
    color:#fff;
    background:#050505;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-3;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.10);
    z-index:-2;
    pointer-events:none;
}

body::-webkit-scrollbar{
    width:9px;
}

body::-webkit-scrollbar-track{
    background:#080808;
}

body::-webkit-scrollbar-thumb{
    background:#ff5a00;
    border-radius:20px;
}

nav{
    position:sticky;
    top:0;
    z-index:1000;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:rgba(5,5,5,.82);
    border-bottom:1px solid rgba(255,90,0,.35);
    backdrop-filter:blur(18px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:43px;
    height:43px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff7a00,#ff3d00);
    color:#fff;
    font-size:21px;
    font-weight:900;
    box-shadow:0 0 25px rgba(255,90,0,.35);
}

.logo-text{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#ddd;
    font-size:13px;
    font-weight:700;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00e676;
    box-shadow:0 0 12px #00e676;
}

.container{
    width:min(1450px,92%);
    margin:auto;
}

.hero{
    text-align:center;
    padding:85px 15px 50px;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border:1px solid rgba(255,90,0,.45);
    border-radius:50px;
    background:rgba(20,10,5,.6);
    color:#ff7a00;
    font-size:13px;
    font-weight:800;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
}

.hero h1{
    font-size:clamp(45px,7vw,82px);
    line-height:1;
    font-weight:900;
    letter-spacing:-3px;
    background:linear-gradient(180deg,#fff 0%,#ffb37a 45%,#ff5100 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

.hero p{
    margin-top:18px;
    color:#eee;
    font-size:16px;
    font-weight:600;
}

.search-box{
    width:min(850px,100%);
    margin:35px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    height:65px;
    border:1px solid rgba(255,90,0,.45);
    outline:none;
    border-radius:18px;
    padding:0 25px 0 145px;
    color:#fff;
    background:rgba(8,8,8,.72);
    backdrop-filter:blur(15px);
    font-family:"Cairo",sans-serif;
    font-size:16px;
    font-weight:600;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
    transition:.25s;
}

.search-box input:focus{
    border-color:#ff5a00;
    box-shadow:0 0 0 4px rgba(255,90,0,.1),0 15px 45px rgba(0,0,0,.3);
}

.search-box input::placeholder{
    color:#999;
}

.search-btn{
    position:absolute;
    left:7px;
    top:7px;
    height:51px;
    padding:0 25px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    background:linear-gradient(135deg,#ff7300,#ff3d00);
    color:#fff;
    font-family:"Cairo",sans-serif;
    font-size:15px;
    font-weight:900;
    box-shadow:0 7px 20px rgba(255,80,0,.25);
    transition:.2s;
}

.search-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 28px rgba(255,80,0,.38);
}

.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin:0 auto 40px;
}

.filter{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(10,10,10,.7);
    color:#bbb;
    border-radius:12px;
    padding:9px 18px;
    cursor:pointer;
    font-family:"Cairo",sans-serif;
    font-weight:800;
    font-size:13px;
    transition:.2s;
    backdrop-filter:blur(10px);
}

.filter:hover{
    color:#fff;
    border-color:rgba(255,90,0,.5);
}

.filter.active{
    color:#fff;
    background:linear-gradient(135deg,#ff7000,#ff3d00);
    border-color:transparent;
    box-shadow:0 7px 20px rgba(255,70,0,.2);
}

.results-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    gap:15px;
}

.results-head h2{
    font-size:21px;
    font-weight:900;
}

.results-count{
    color:#aaa;
    font-size:13px;
    font-weight:700;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
    padding-bottom:70px;
}

.card{
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    background:rgba(7,7,7,.78);
    backdrop-filter:blur(15px);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    transition:transform .25s,border-color .25s,box-shadow .25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:rgba(255,90,0,.55);
    box-shadow:0 18px 45px rgba(0,0,0,.4),0 0 25px rgba(255,70,0,.08);
}

.card-image{
    width:100%;
    height:205px;
    background:#111;
    border-bottom:1px solid rgba(255,255,255,.08);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card-image img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#0d0d0d;
}

.no-image{
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:13px;
    font-weight:700;
    text-align:center;
    padding:20px;
}

.card-body{
    padding:17px;
}

.card-title{
    font-size:16px;
    line-height:1.6;
    font-weight:900;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.game-name{
    margin-top:4px;
    color:#999;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tags{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:13px;
}

.tag{
    padding:4px 8px;
    border-radius:7px;
    background:rgba(255,255,255,.07);
    color:#aaa;
    font-size:10px;
    font-weight:800;
}

.tag.orange{
    color:#ff8a3d;
    background:rgba(255,90,0,.1);
}

.tag.green{
    color:#48e28b;
    background:rgba(0,220,110,.09);
}

.card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:16px;
}

.views{
    color:#888;
    font-size:11px;
    font-weight:700;
}

.view-btn{
    border:0;
    border-radius:9px;
    padding:8px 13px;
    background:#ff5700;
    color:#fff;
    font-family:"Cairo",sans-serif;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.view-btn:hover{
    background:#ff7100;
}

.loading{
    grid-column:1/-1;
    min-height:250px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    color:#aaa;
    font-weight:700;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid rgba(255,255,255,.08);
    border-top-color:#ff5a00;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    grid-column:1/-1;
    padding:70px 20px;
    text-align:center;
    color:#999;
    background:rgba(5,5,5,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
}

.empty strong{
    display:block;
    color:#fff;
    font-size:20px;
    margin-bottom:8px;
}

.error{
    grid-column:1/-1;
    padding:30px;
    text-align:center;
    border-radius:16px;
    border:1px solid rgba(255,70,0,.3);
    background:rgba(80,20,0,.2);
    color:#ff9a68;
    font-weight:700;
}

footer{
    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(3,3,3,.75);
    backdrop-filter:blur(15px);
    padding:25px;
    text-align:center;
    color:#777;
    font-size:12px;
    font-weight:700;
}

footer span{
    color:#ff6500;
}

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:90vh;
    overflow:hidden;
    border:1px solid rgba(255,90,0,.4);
    border-radius:20px;
    background:#080808;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.modal-title{
    font-weight:900;
    font-size:17px;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

.code{
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:70vh;
    overflow:auto;
    padding:20px;
    color:#ddd;
    background:#050505;
    font-family:monospace;
    font-size:13px;
    line-height:1.7;
}

.code::-webkit-scrollbar{
    width:8px;
}

.code::-webkit-scrollbar-thumb{
    background:#ff5700;
    border-radius:20px;
}

@media(max-width:1100px){
    .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:800px){
    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    nav{
        padding:0 4%;
    }

    .status{
        display:none;
    }

    .hero{
        padding-top:65px;
    }
}

@media(max-width:560px){
    .grid{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .search-box input{
        padding-left:115px;
    }

    .search-btn{
        padding:0 17px;
    }

    .card-image{
        height:230px;
    }

    .filters{
        justify-content:flex-start;
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:5px;
    }

    .filter{
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <div class="logo-box">S</div>
        <div class="logo-text">SAP</div>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        API ONLINE
    </div>
</nav>

<main class="container">

    <section class="hero">
        <div class="hero-badge">
            🔥 بحث سكربتات روبلوكس
        </div>

        <h1>SAP Scripts</h1>

        <p>موقع SAP + موثوق للبحث عن سكربتات روبلوكس</p>

        <form class="search-box" id="searchForm">
            <input
                id="searchInput"
                type="text"
                autocomplete="off"
                placeholder="ابحث عن اسم الماب أو السكربت..."
            >
            <button class="search-btn" type="submit">بحث</button>
        </form>
    </section>

    <div class="filters">
        <button class="filter active" data-filter="all">ALL</button>
        <button class="filter" data-filter="free">FREE</button>
        <button class="filter" data-filter="key">KEY</button>
        <button class="filter" data-filter="verified">VERIFIED</button>
        <button class="filter" data-filter="patched">PATCHED</button>
    </div>

    <section>
        <div class="results-head">
            <h2>السكربتات</h2>
            <div class="results-count" id="resultsCount">0 سكربت</div>
        </div>

        <div class="grid" id="results">
            <div class="loading">
                <div class="spinner"></div>
                جاري تحميل السكربتات...
            </div>
        </div>
    </section>

</main>

<footer>
    SAP © 2026 — <span>Powered by ScriptBlox.com</span>
</footer>

<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">Script</div>
            <button class="close" id="closeModal">×</button>
        </div>

        <pre class="code" id="codeBox">جاري تحميل السكربت...</pre>
    </div>
</div>

<script>
const API="https://scriptblox.com/api/script/search";
const RAW_API="https://scriptblox.com/api/script/raw/";

const results=document.getElementById("results");
const searchInput=document.getElementById("searchInput");
const searchForm=document.getElementById("searchForm");
const resultsCount=document.getElementById("resultsCount");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const codeBox=document.getElementById("codeBox");
const closeModal=document.getElementById("closeModal");

let scripts=[];
let activeFilter="all";

const escapeHTML=value=>{
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
};

const normalizeImage=url=>{
    if(typeof url!=="string" || !url.trim()){
        return "";
    }

    const value=url.trim();

    if(value.startsWith("https://") || value.startsWith("http://")){
        return value;
    }

    if(value.startsWith("//")){
        return "https:"+value;
    }

    if(value.startsWith("/")){
        return "https://scriptblox.com"+value;
    }

    return value;
};

const getGameImage=script=>{
    return normalizeImage(script?.game?.imageUrl);
};

const getScriptImage=script=>{
    return normalizeImage(script?.image);
};

const getImageHTML=(url,alt)=>{
    if(!url){
        return `
            <div class="no-image">
                صورة الماب غير متاحة
            </div>
        `;
    }

    return `
        <img
            src="${escapeHTML(url)}"
            alt="${escapeHTML(alt)}"
            loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.style.display='none';this.parentElement.innerHTML='<div class=&quot;no-image&quot;>صورة الماب غير متاحة</div>'"
        >
    `;
};

const formatViews=value=>{
    const number=Number(value)||0;

    if(number>=1000000){
        return (number/1000000).toFixed(1)+"M";
    }

    if(number>=1000){
        return (number/1000).toFixed(1)+"K";
    }

    return number.toLocaleString("en-US");
};

const matchesFilter=script=>{
    if(activeFilter==="all"){
        return true;
    }

    if(activeFilter==="free"){
        return String(script?.scriptType||"").toLowerCase()==="free";
    }

    if(activeFilter==="key"){
        return Boolean(script?.key);
    }

    if(activeFilter==="verified"){
        return Boolean(script?.verified);
    }

    if(activeFilter==="patched"){
        return Boolean(script?.isPatched);
    }

    return true;
};

const renderCards=list=>{
    const filtered=list.filter(matchesFilter);

    resultsCount.textContent=`${filtered.length} سكربت`;

    if(!filtered.length){
        results.innerHTML=`
            <div class="empty">
                <strong>ما حصلنا نتائج</strong>
                جرّب اسم ماب أو سكربت مختلف
            </div>
        `;
        return;
    }

    results.innerHTML=filtered.map((script,index)=>{
        const gameName=script?.game?.name || "Unknown Game";
        const title=script?.title || "Untitled Script";
        const gameImage=getGameImage(script);
        const scriptImage=getScriptImage(script);

        const image=gameImage || scriptImage;

        return `
            <article class="card">
                <div class="card-image">
                    ${getImageHTML(image,gameName)}
                </div>

                <div class="card-body">
                    <div class="card-title" title="${escapeHTML(title)}">
                        ${escapeHTML(title)}
                    </div>

                    <div class="game-name" title="${escapeHTML(gameName)}">
                        ${escapeHTML(gameName)}
                    </div>

                    <div class="tags">
                        ${
                            script?.verified
                            ? `<span class="tag green">✓ VERIFIED</span>`
                            : ""
                        }

                        ${
                            script?.key
                            ? `<span class="tag orange">KEY</span>`
                            : `<span class="tag">FREE</span>`
                        }

                        ${
                            script?.isPatched
                            ? `<span class="tag orange">PATCHED</span>`
                            : ""
                        }

                        ${
                            script?.isUniversal
                            ? `<span class="tag">UNIVERSAL</span>`
                            : ""
                        }
                    </div>

                    <div class="card-bottom">
                        <span class="views">
                            👁 ${formatViews(script?.views)}
                        </span>

                        <button
                            class="view-btn"
                            data-index="${index}"
                        >
                            عرض السكربت
                        </button>
                    </div>
                </div>
            </article>
        `;
    }).join("");

    results.querySelectorAll(".view-btn").forEach(button=>{
        button.addEventListener("click",()=>{
            const index=Number(button.dataset.index);
            const filtered=list.filter(matchesFilter);
            openScript(filtered[index]);
        });
    });
};

const searchScripts=async query=>{
    results.innerHTML=`
        <div class="loading">
            <div class="spinner"></div>
            جاري البحث...
        </div>
    `;

    try{
        const q=query.trim() || "roblox";

        const response=await fetch(
            `${API}?q=${encodeURIComponent(q)}&max=20`,
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error("API Error");
        }

        const data=await response.json();

        if(data?.message){
            throw new Error(data.message);
        }

        scripts=Array.isArray(data?.result?.scripts)
            ? data.result.scripts
            : [];

        renderCards(scripts);
    }catch(error){
        scripts=[];

        resultsCount.textContent="0 سكربت";

        results.innerHTML=`
            <div class="error">
                تعذر تحميل السكربتات حالياً.<br>
                حاول مرة أخرى بعد قليل.
            </div>
        `;
    }
};

const openScript=async script=>{
    modal.classList.add("show");

    modalTitle.textContent=script?.title || "Script";
    codeBox.textContent="جاري تحميل السكربت...";

    let code=script?.script || "";

    if(!code && script?.slug){
        try{
            const response=await fetch(
                RAW_API+encodeURIComponent(script.slug),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

            if(response.ok){
                const text=await response.text();

                try{
                    const json=JSON.parse(text);
                    code=json?.script || json?.result?.script || text;
                }catch{
                    code=text;
                }
            }
        }catch{}
    }

    codeBox.textContent=code || "السكربت غير متوفر.";
};

const closeScriptModal=()=>{
    modal.classList.remove("show");
};

searchForm.addEventListener("submit",event=>{
    event.preventDefault();

    const query=searchInput.value.trim();

    if(query){
        searchScripts(query);
    }else{
        searchScripts("roblox");
    }
});

document.querySelectorAll(".filter").forEach(button=>{
    button.addEventListener("click",()=>{
        document.querySelectorAll(".filter").forEach(item=>{
            item.classList.remove("active");
        });

        button.classList.add("active");
        activeFilter=button.dataset.filter;

        renderCards(scripts);
    });
});

closeModal.addEventListener("click",closeScriptModal);

modal.addEventListener("click",event=>{
    if(event.target===modal){
        closeScriptModal();
    }
});

document.addEventListener("keydown",event=>{
    if(event.key==="Escape"){
        closeScriptModal();
    }
});

searchScripts("roblox");
</script>

</body>
</html>
