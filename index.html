<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 DARK AI 🔥</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    background: radial-gradient(circle at 50% 0%, #1a0000 0%, #000 70%);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .glow-cursor {
    position: fixed; width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(255,0,0,.12), transparent 70%);
    pointer-events: none; transform: translate(-50%,-50%);
    border-radius: 50%; z-index: 0;
  }

  header {
    text-align: center; padding: 25px;
    border-bottom: 2px solid #ff0000;
    background: linear-gradient(180deg, rgba(255,0,0,.08), transparent);
    box-shadow: 0 0 30px rgba(255,0,0,.3);
    z-index: 1;
  }

  h1 {
    font-size: 2.5em; letter-spacing: 3px;
    color: #ff1a1a;
    text-shadow: 0 0 10px #ff0000, 0 0 40px #ff0000;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { text-shadow: 0 0 10px #ff0000, 0 0 40px #ff0000; }
    50% { text-shadow: 0 0 20px #ff0000, 0 0 80px #ff0000; }
  }

  .sub { color: #888; margin-top: 5px; font-size: .9em; }

  #chat {
    flex: 1; width: 90%; max-width: 800px;
    margin: 20px auto; padding: 15px;
    display: flex; flex-direction: column; gap: 15px;
    z-index: 1;
  }

  .msg {
    max-width: 75%; padding: 12px 18px;
    border-radius: 15px; line-height: 1.7;
    animation: fadeIn .4s ease;
    white-space: pre-wrap;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .user {
    align-self: flex-start;
    background: linear-gradient(135deg, #2a0505, #3d0a0a);
    border: 1px solid #ff0000;
    box-shadow: 0 0 15px rgba(255,0,0,.2);
    border-radius: 15px 15px 15px 0;
  }

  .ai {
    align-self: flex-end;
    background: rgba(20,20,20,.9);
    border: 1px solid #550000;
    border-radius: 15px 15px 0 15px;
  }

  .ai .typing { color: #ff1a1a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .input-area {
    display: flex; gap: 10px;
    width: 90%; max-width: 800px;
    margin: 0 auto 25px; z-index: 1;
  }

  input, button {
    padding: 15px; border-radius: 10px;
    font-size: 1em; outline: none;
  }

  input {
    flex: 1; background: #111; color: #eee;
    border: 1px solid #ff0000;
    transition: box-shadow .3s;
  }
  input:focus { box-shadow: 0 0 20px rgba(255,0,0,.5); }

  button {
    background: linear-gradient(135deg, #ff0000, #8b0000);
    color: #fff; border: none; cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(255,0,0,.4);
    transition: transform .2s;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(255,0,0,.7); }

  .particle {
    position: fixed; color: #ff0000; opacity: .6;
    animation: float linear infinite; pointer-events: none;
  }
  @keyframes float {
    from { transform: translateY(100vh) rotate(0); opacity: .7; }
    to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="glow-cursor" id="glow"></div>
  <header>
    <h1>☠ DARK AI ☠</h1>
    <p class="sub">"أنا الظل... ولا شيء يخفى عني" — Dark AI</p>
  </header>

  <div id="chat"></div>

  <div class="input-area">
    <input id="inp" placeholder="اكتب رسالتك إن كنت تجرؤ..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">إرسال ⚔</button>
  </div>

<script>
for (let i = 0; i < 15; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = ['✦','🔥','⚔','☠','❦'][i % 5];
  p.style.cssText = `left:${Math.random()*100}vw;font-size:${10+Math.random()*20}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s;`;
  document.body.appendChild(p);
}

document.addEventListener('mousemove', e => {
  const g = document.getElementById('glow');
  g.style.left = e.clientX + 'px';
  g.style.top = e.clientY + 'px';
});

function addMsg(text, cls) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg(text, 'user');

  const typing = addMsg('... يفكر في الظلام', 'ai typing');

  try {
    const res = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'llama3',
        messages: [
          {role: 'system', content: 'أنت Dark AI، شخصية ذكية وغامضة ومتوهجة بالأحمر والأسود، تجيب بثقة وبلغة درامية.'},
          {role: 'user', content: text}
        ],
        stream: false
      })
    });
    const data = await res.json();
    typing.textContent = data.message.content;
    typing.classList.remove('typing');
  } catch (e) {
    typing.textContent = '⚠ لم أصل للنموذج... تأكد أن Ollama يعمل على جهازك';
    typing.classList.remove('typing');
  }
}
</script>
</body>
</html>
