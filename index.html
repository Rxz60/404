<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>SAP | Lua Key Generator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Tahoma, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.07), transparent 35%),
        #030303;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 720px;
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-bottom: 25px;
}

.panel {
    background: rgba(10,10,10,.94);
    border: 1px solid #292929;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 0 45px rgba(255,255,255,.04);
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 9px;
}

select,
input {
    width: 100%;
    height: 48px;
    background: #080808;
    color: white;
    border: 1px solid #292929;
    border-radius: 12px;
    outline: none;
    padding: 0 14px;
    font-size: 14px;
    margin-bottom: 18px;
}

select:focus,
input:focus {
    border-color: #666;
}

.generate {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 13px;
    background: white;
    color: black;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255,255,255,.12);
}

.result {
    margin-top: 22px;
    display: none;
}

.result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
}

.result-top span {
    color: #aaa;
    font-size: 13px;
}

.copy {
    background: #161616;
    color: white;
    border: 1px solid #292929;
    border-radius: 9px;
    padding: 8px 13px;
    cursor: pointer;
}

.key {
    width: 100%;
    min-height: 95px;
    background: #050505;
    border: 1px solid #292929;
    border-radius: 13px;
    padding: 16px;
    color: #eee;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-all;
    direction: ltr;
    text-align: left;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.action {
    height: 45px;
    border-radius: 11px;
    border: 1px solid #292929;
    background: #101010;
    color: white;
    cursor: pointer;
}

.action:hover {
    background: #181818;
}

.batch {
    margin-top: 28px;
    padding-top: 23px;
    border-top: 1px solid #222;
}

.batch-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.batch-text {
    color: #888;
    font-size: 12px;
    margin-bottom: 15px;
}

.batch-result {
    display: none;
    margin-top: 15px;
}

.keys-list {
    max-height: 260px;
    overflow-y: auto;
    background: #050505;
    border: 1px solid #292929;
    border-radius: 13px;
    padding: 8px;
}

.key-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid #191919;
}

.key-item:last-child {
    border-bottom: 0;
}

.key-number {
    color: #666;
    width: 28px;
    font-size: 12px;
}

.key-value {
    flex: 1;
    direction: ltr;
    text-align: left;
    font-family: monospace;
    font-size: 12px;
    word-break: break-all;
    color: #ddd;
}

.small-copy {
    border: 1px solid #292929;
    background: #111;
    color: white;
    border-radius: 7px;
    padding: 6px 9px;
    cursor: pointer;
}

.status {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: #000;
    padding: 11px 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
}

.status.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 18px;
}

@media(max-width:600px) {
    .logo {
        font-size: 34px;
    }

    .panel {
        padding: 18px;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">SAP</div>
    <div class="subtitle">Lua Roblox Key Generator</div>

    <div class="panel">

        <div class="title">إنشاء مفتاح جديد</div>

        <label>طول المفتاح</label>

        <select id="length">
            <option value="16">16 حرف</option>
            <option value="24">24 حرف</option>
            <option value="32" selected>32 حرف</option>
            <option value="48">48 حرف</option>
            <option value="64">64 حرف</option>
        </select>

        <label>عدد المفاتيح</label>

        <input id="count" type="number" min="1" max="100" value="1">

        <button class="generate" id="generate">
            توليد المفتاح
        </button>

        <div class="result" id="singleResult">

            <div class="result-top">
                <span>المفتاح الناتج</span>
                <button class="copy" id="copySingle">نسخ</button>
            </div>

            <div class="key" id="singleKey"></div>

            <div class="actions">
                <button class="action" id="newKey">
                    توليد مفتاح جديد
                </button>

                <button class="action" id="downloadSingle">
                    تحميل TXT
                </button>
            </div>

        </div>

        <div class="batch" id="batchSection">

            <div class="batch-title">توليد عدة مفاتيح</div>

            <div class="batch-text">
                يمكنك إنشاء حتى 100 مفتاح دفعة واحدة.
            </div>

            <button class="action" id="generateBatch">
                إنشاء المفاتيح
            </button>

            <div class="batch-result" id="batchResult">

                <div class="keys-list" id="keysList"></div>

                <div class="actions">
                    <button class="action" id="copyAll">
                        نسخ الكل
                    </button>

                    <button class="action" id="downloadAll">
                        تحميل TXT
                    </button>
                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        SAP © 2026
    </div>

</div>

<div class="status" id="status">
    تم النسخ
</div>

<script>
const lengthInput = document.getElementById("length");
const countInput = document.getElementById("count");
const generateButton = document.getElementById("generate");
const generateBatchButton = document.getElementById("generateBatch");
const singleResult = document.getElementById("singleResult");
const singleKey = document.getElementById("singleKey");
const copySingle = document.getElementById("copySingle");
const newKey = document.getElementById("newKey");
const downloadSingle = document.getElementById("downloadSingle");
const batchResult = document.getElementById("batchResult");
const keysList = document.getElementById("keysList");
const copyAll = document.getElementById("copyAll");
const downloadAll = document.getElementById("downloadAll");
const status = document.getElementById("status");

let currentKey = "";
let allKeys = [];

function randomKey(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const values = new Uint32Array(length);
    crypto.getRandomValues(values);

    let output = "";

    for (let i = 0; i < length; i++) {
        output += chars[values[i] % chars.length];
    }

    return output;
}

function showStatus(text) {
    status.textContent = text;
    status.classList.add("show");

    setTimeout(() => {
        status.classList.remove("show");
    }, 1600);
}

function downloadText(filename, text) {
    const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
}

generateButton.onclick = () => {
    const length = Number(lengthInput.value);

    currentKey = randomKey(length);

    singleKey.textContent = currentKey;
    singleResult.style.display = "block";

    batchResult.style.display = "none";

    showStatus("تم إنشاء المفتاح");
};

newKey.onclick = () => {
    const length = Number(lengthInput.value);

    currentKey = randomKey(length);

    singleKey.textContent = currentKey;

    showStatus("تم إنشاء مفتاح جديد");
};

copySingle.onclick = async () => {
    if (!currentKey) return;

    await navigator.clipboard.writeText(currentKey);

    showStatus("تم نسخ المفتاح");
};

downloadSingle.onclick = () => {
    if (!currentKey) return;

    downloadText("SAP-Key.txt", currentKey);

    showStatus("تم تحميل المفتاح");
};

generateBatchButton.onclick = () => {
    let count = Number(countInput.value);
    const length = Number(lengthInput.value);

    if (count < 1) count = 1;
    if (count > 100) count = 100;

    countInput.value = count;

    allKeys = [];

    keysList.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const key = randomKey(length);

        allKeys.push(key);

        const item = document.createElement("div");
        item.className = "key-item";

        const number = document.createElement("div");
        number.className = "key-number";
        number.textContent = i + 1;

        const value = document.createElement("div");
        value.className = "key-value";
        value.textContent = key;

        const button = document.createElement("button");
        button.className = "small-copy";
        button.textContent = "نسخ";

        button.onclick = async () => {
            await navigator.clipboard.writeText(key);
            showStatus("تم نسخ المفتاح");
        };

        item.appendChild(number);
        item.appendChild(value);
        item.appendChild(button);

        keysList.appendChild(item);
    }

    batchResult.style.display = "block";

    showStatus("تم إنشاء " + count + " مفتاح");
};

copyAll.onclick = async () => {
    if (!allKeys.length) return;

    await navigator.clipboard.writeText(allKeys.join("\n"));

    showStatus("تم نسخ جميع المفاتيح");
};

downloadAll.onclick = () => {
    if (!allKeys.length) return;

    downloadText(
        "SAP-Keys.txt",
        allKeys.join("\n")
    );

    showStatus("تم تحميل جميع المفاتيح");
};
</script>

</body>
</html>
