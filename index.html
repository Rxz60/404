<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }

  body { background: radial-gradient(circle at 50% 0%, #1a0000 0%, #000 70%); color:#eee; height:100vh; display:flex; overflow:hidden; }

  .glow-cursor {
    position:fixed; width:250px; height:250px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,0,0,.12), transparent 70%);
    pointer-events:none; transform:translate(-50%,-50%); z-index:0;
  }

  /* الشريط الجانبي */
  .sidebar {
    width:260px; background:#0a0000; border-left:1px solid #500;
    display:flex; flex-direction:column; padding:15px;
    transition:margin .3s; z-index:2;
  }
  .sidebar.hidden { margin-right:-260px; }
  .new-chat {
    padding:12px; background:linear-gradient(135deg,#f00,#700); color:#fff;
    border:none; border-radius:10px; cursor:pointer; font-weight:bold; margin-bottom:15px;
  }
  .new-chat:hover { box-shadow:0 0 20px #f00; }
  .chat-list { flex:1; overflow-y:auto; }
  .chat-item {
    padding:10px; border:1px solid #300; border-radius:8px;
    margin-bottom:8px; cursor:pointer; font-size:.9em;
  }
  .chat-item:hover, .chat-item.active { border-color:#f00; background:#1a0505; }
  .model-select {
    width:100%; padding:10px; background:#111; color:#eee;
    border:1px solid #f00; border-radius:8px; margin-top:10px;
  }

  /* المنطقة الرئيسية */
  .main { flex:1; display:flex; flex-direction:column; }

  .topbar {
    display:flex; align-items:center; gap:12px;
    padding:12px 20px; border-bottom:1px solid #300; background:#0a0000; z-index:1;
  }
  .burger {
    width:40px; height:40px; background:none; border:1px solid #f00;
    border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:5px;
  }
  .burger span { width:20px; height:2px; background:#f00; box-shadow:0 0 5px #f00; }
  .burger:hover { box-shadow:0 0 15px rgba(255,0,0,.5); }
  .title { color:#ff1a1a; text-shadow:0 0 10px #f00; font-size:1.3em; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { text-shadow:0 0 30px #f00; } }

  #chat { flex:1; overflow-y:auto; padding:25px; display:flex; flex-direction:column; gap:15px; }
  .msg { max-width:70%; padding:13px 17px; border-radius:15px; line-height:1.7; white-space:pre-wrap; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  .user { align-self:flex-start; background:linear-gradient(135deg,#2a0505,#3d0a0a); border:1px solid #f00; }
  .ai { align-self:flex-end; background:#141414; border:1px solid #500; }
  .typing { color:#ff1a1a; animation:blink 1s infinite; }
  @keyframes blink { 50%{opacity:.3} }

  .input-area { display:flex; gap:10px; padding:15px 25px; background:#050000; border-top:1px solid #300; }
  input { flex:1; padding:15px; background:#111; color:#eee; border:1px solid #f00; border-radius:12px; outline:none; }
  input:focus { box-shadow:0 0 20px rgba(255,0,0,.5); }
  button.send { padding:15px 30px; background:linear-gradient(135deg,#f00,#700); color:#fff; border:none; border-radius:12px; cursor:pointer; font-weight:bold; }
  button.send:hover { box-shadow:0 0 25px #f00; transform:scale(1.03); }

  .particle { position:fixed; color:#f00; opacity:.5; animation:float linear infinite; pointer-events:none; }
  @keyframes float { from{transform:translateY(100vh)} to{transform:translateY(-10vh);opacity:0} }
</style>
</head>
<body>
  <div class="glow-cursor" id="glow"></div>

  <div class="sidebar" id="sidebar">
    <button class="new-chat" onclick="newChat()">+ محادثة جديدة</button>
    <div class="chat-list" id="chatList"></div>
    <select class="model-select" id="modelSel" onchange="setModel()"></select>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="burger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </div>
      <div class="title">☠ DARK AI ☠</div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
      <input id="inp" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')send()">
      <button class="send" onclick="send()">إرسال ⚔</button>
    </div>
  </div>

<script>
let currentModel = 'llama3';
let chats = {};
let activeChat = null;
let history = [];

document.addEventListener('mousemove', e => {
  const g = document.getElementById('glow');
  g.style.left = e.clientX + 'px';
  g.style.top = e.clientY + 'px';
});

for (let i = 0; i < 12; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = ['✦','🔥','⚔','☠'][i % 4];
  p.style.cssText = `left:${Math.random()*100}vw;font-size:${10+Math.random()*18}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s;`;
  document.body.appendChild(p);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('hidden');
}

function newChat() {
  const id = Date.now();
  chats[id] = { title: 'محادثة ' + (Object.keys(chats).length + 1), messages: [] };
  activeChat = id;
  history = [];
  document.getElementById('chat').innerHTML = '';
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  for (const id in chats) {
    const d = document.createElement('div');
    d.className = 'chat-item' + (id == activeChat ? ' active' : '');
    d.textContent = chats[id].title;
    d.onclick = () => { activeChat = id; history = [...chats[id].messages]; renderChat(id); renderChatList(); };
    list.appendChild(d);
  }
}

function renderChat(id) {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  chats[id].messages.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'ai'));
}

function setModel() {
  currentModel = document.getElementById('modelSel').value;
}

function addMsg(text, cls) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function loadModels() {
  try {
    const res = await fetch('http://localhost:11434/api/tags');
    const data = await res.json();
    const sel = document.getElementById('modelSel');
    sel.innerHTML = '';
    data.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m.name;
      o.textContent = m.name;
      sel.appendChild(o);
    });
    if (data.models.length) currentModel = data.models[0].name;
  } catch(e) {
    const sel = document.getElementById('modelSel');
    sel.innerHTML = '<option>شغّل Ollama أولاً</option>';
  }
}

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  if (!activeChat) newChat();
  inp.value = '';
  addMsg(text, 'user');
  chats[activeChat].messages.push({role:'user', content:text});
  history.push({role:'user', content:text});

  const typing = addMsg('يفكر...', 'ai typing');

  try {
    const res = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: currentModel,
        messages: [
          {role:'system', content:'أنت Dark AI، شخصية ذكية وغامضة تجيب بثقة وبلغة درامية.'},
          ...history
        ],
        stream: true
      })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    typing.classList.remove('typing');
    typing.textContent = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const json = JSON.parse(chunk);
      full += json.message.content;
      typing.textContent = full;
      typing.scrollIntoView({behavior:'smooth', block:'end'});
    }

    chats[activeChat].messages.push({role:'assistant', content:full});
    history.push({role:'assistant', content:full});
  } catch(e) {
    typing.classList.remove('typing');
    typing.textContent = '⚠ لا يوجد اتصال بالنموذج. افتح الطرفية ونفّذ:\nollama serve\nثم:\nOLLAMA_ORIGINS=* ollama run llama3';
  }
}

newChat();
loadModels();
</script>
</body>
</html>
