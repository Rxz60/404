<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP | بحث سكربتات</title>

<style>
:root{
    --orange:#ff6900;
    --orange2:#ff9d22;
    --black:#050505;
    --card:#0b0b0b;
    --border:rgba(255,105,0,.25);
    --text:#fff;
    --muted:#999;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    background:#020202;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;
    background-image:url("https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transform:scale(1.04);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        linear-gradient(
            rgba(0,0,0,.48),
            rgba(0,0,0,.82)
        ),
        radial-gradient(
            circle at 50% 10%,
            rgba(255,105,0,.16),
            transparent 45%
        );
    pointer-events:none;
}

nav{
    width:100%;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,105,0,.2);
}

.logo{
    font-size:30px;
    font-weight:1000;
    letter-spacing:-2px;
    color:#fff;
}

.logo span{
    color:var(--orange);
}

.status{
    display:flex;
    align-items:center;
    gap:9px;
    color:#bbb;
    font-size:12px;
    font-weight:800;
}

.dot{
    width:9px;
    height:9px;
    background:#21e65c;
    border-radius:50%;
    box-shadow:0 0 14px #21e65c;
}

.hero{
    min-height:480px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:70px 20px 50px;
}

.badge{
    padding:9px 17px;
    border:1px solid rgba(255,105,0,.45);
    background:rgba(255,105,0,.09);
    border-radius:999px;
    color:#ff9d22;
    font-size:12px;
    font-weight:900;
    margin-bottom:22px;
    box-shadow:0 0 30px rgba(255,105,0,.08);
}

.hero h1{
    direction:ltr;
    font-size:clamp(55px,10vw,105px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-7px;
    text-shadow:0 8px 50px rgba(0,0,0,.8);
}

.hero h1 span{
    color:var(--orange);
}

.hero p{
    margin-top:20px;
    color:#ddd;
    font-size:17px;
    font-weight:700;
}

.search{
    width:min(780px,94vw);
    height:65px;
    margin-top:35px;
    display:flex;
    direction:ltr;
    align-items:center;
    padding:7px;
    background:rgba(7,7,7,.85);
    border:1px solid rgba(255,105,0,.3);
    border-radius:18px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.65),
        0 0 45px rgba(255,105,0,.08);
    backdrop-filter:blur(15px);
}

.search-icon{
    width:50px;
    text-align:center;
    font-size:28px;
    color:var(--orange);
}

.search input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
    direction:rtl;
    text-align:right;
    padding:0 10px;
    font-size:15px;
}

.search input::placeholder{
    color:#777;
}

.search button{
    height:100%;
    min-width:105px;
    border:0;
    border-radius:13px;
    color:#fff;
    background:linear-gradient(135deg,var(--orange),#ff4300);
    font-weight:1000;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 25px rgba(255,105,0,.18);
}

.search button:hover{
    transform:scale(1.03);
    box-shadow:0 0 35px rgba(255,105,0,.3);
}

.container{
    width:min(1400px,94%);
    margin:auto;
    padding-bottom:90px;
}

.toolbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:25px;
    margin-bottom:25px;
}

.title{
    font-size:25px;
    font-weight:1000;
}

.count{
    color:#888;
    font-size:12px;
    margin-top:7px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    direction:ltr;
}

.filter{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(8,8,8,.8);
    color:#aaa;
    padding:9px 14px;
    border-radius:10px;
    font-size:11px;
    font-weight:1000;
    cursor:pointer;
    transition:.2s;
}

.filter:hover{
    border-color:rgba(255,105,0,.45);
    color:#fff;
}

.filter.active{
    color:#fff;
    background:var(--orange);
    border-color:var(--orange);
    box-shadow:0 0 20px rgba(255,105,0,.2);
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    min-width:0;
    overflow:hidden;
    position:relative;
    background:rgba(6,6,6,.88);
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.5);
    transition:.25s;
    backdrop-filter:blur(10px);
}

.card:hover{
    transform:translateY(-7px);
    border-color:rgba(255,105,0,.5);
    box-shadow:
        0 22px 55px rgba(0,0,0,.65),
        0 0 35px rgba(255,105,0,.08);
}

.card-image{
    width:100%;
    height:210px;
    background:#101010;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.card-image img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:center;
    background:#101010;
}

.card-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.6),
        transparent 55%
    );
    pointer-events:none;
}

.type{
    position:absolute;
    top:12px;
    right:12px;
    z-index:2;
    padding:6px 9px;
    border-radius:8px;
    background:rgba(0,0,0,.78);
    border:1px solid rgba(255,105,0,.35);
    color:#ff9d22;
    font-size:9px;
    font-weight:1000;
    direction:ltr;
}

.card-body{
    padding:16px;
}

.card-title{
    font-size:16px;
    font-weight:1000;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    direction:rtl;
    text-align:right;
}

.game-name{
    margin-top:7px;
    color:#aaa;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    direction:rtl;
    text-align:right;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:13px;
    direction:ltr;
}

.tag{
    padding:5px 7px;
    border-radius:6px;
    font-size:8px;
    font-weight:1000;
    border:1px solid rgba(255,255,255,.1);
    color:#aaa;
    background:#111;
}

.tag.orange{
    color:#ff9d22;
    border-color:rgba(255,105,0,.3);
}

.tag.green{
    color:#43e879;
    border-color:rgba(67,232,121,.25);
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:16px;
}

.views{
    color:#777;
    font-size:10px;
    direction:ltr;
}

.open-btn{
    border:0;
    background:var(--orange);
    color:#fff;
    padding:9px 13px;
    border-radius:9px;
    font-size:10px;
    font-weight:1000;
    cursor:pointer;
}

.loading{
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--orange);
    font-size:40px;
    font-weight:1000;
}

.loading::after{
    content:"";
    width:35px;
    height:35px;
    border:3px solid rgba(255,105,0,.2);
    border-top-color:var(--orange);
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.empty{
    display:none;
    text-align:center;
    padding:80px 20px;
    color:#777;
}

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:90vh;
    overflow:hidden;
    background:#080808;
    border:1px solid rgba(255,105,0,.3);
    border-radius:20px;
    box-shadow:0 30px 100px #000;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.modal-title{
    font-weight:1000;
    font-size:17px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:9px;
    background:#151515;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.modal-content{
    padding:20px;
    overflow:auto;
    max-height:calc(90vh - 75px);
}

.modal-game{
    color:#999;
    font-size:12px;
    margin-bottom:15px;
}

.code{
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    background:#030303;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    padding:18px;
    min-height:180px;
    max-height:420px;
    overflow:auto;
    color:#ddd;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.6;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-actions button,
.modal-actions a{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px;
    text-align:center;
    text-decoration:none;
    font-size:11px;
    font-weight:1000;
    cursor:pointer;
}

.copy{
    background:var(--orange);
    color:#fff;
}

.open-scriptblox{
    background:#151515;
    color:#fff;
    border:1px solid rgba(255,255,255,.1)!important;
}

footer{
    text-align:center;
    padding:30px 20px;
    border-top:1px solid rgba(255,255,255,.07);
    background:rgba(0,0,0,.75);
    color:#666;
    font-size:11px;
}

footer span{
    color:var(--orange);
    font-weight:900;
}

@media(max-width:1100px){
    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:800px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .filters{
        justify-content:flex-start;
    }
}

@media(max-width:560px){
    nav{
        padding:0 20px;
    }

    .hero{
        min-height:430px;
        padding-top:45px;
    }

    .hero h1{
        letter-spacing:-4px;
    }

    .search{
        height:59px;
    }

    .search button{
        min-width:80px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card-image{
        height:240px;
    }

    .status{
        font-size:9px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">SA<span>P</span></div>
    <div class="status">
        <div class="dot"></div>
        API ONLINE
    </div>
</nav>

<section class="hero">
    <div class="badge">⚡ ROBLOX SCRIPT SEARCH</div>

    <h1>SAP <span>Scripts</span></h1>

    <p>بحث سكربتات روبلوكس</p>

    <form class="search" id="searchForm">
        <div class="search-icon">⌕</div>

        <input
            id="searchInput"
            type="text"
            autocomplete="off"
            placeholder="اكتب اسم الماب أو السكربت..."
        >

        <button type="submit">بحث</button>
    </form>
</section>

<main class="container">

    <div class="toolbar">

        <div>
            <div class="title" id="resultTitle">السكربتات</div>
            <div class="count" id="resultCount">جاري التحميل...</div>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all">ALL</button>
            <button class="filter" data-filter="free">FREE</button>
            <button class="filter" data-filter="key">KEY</button>
            <button class="filter" data-filter="verified">VERIFIED</button>
            <button class="filter" data-filter="patched">PATCHED</button>
        </div>

    </div>

    <div class="loading" id="loading"></div>

    <div class="empty" id="empty">
        <h2>ما حصلنا سكربتات</h2>
        <p>جرب اسم ماب أو سكربت مختلف</p>
    </div>

    <div class="grid" id="results"></div>

</main>

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-head">
            <div class="modal-title" id="modalTitle">Script</div>
            <button class="close" id="close">×</button>
        </div>

        <div class="modal-content">

            <div class="modal-game" id="modalGame"></div>

            <pre class="code" id="code">جاري تحميل السكربت...</pre>

            <div class="modal-actions">
                <button class="copy" id="copy">نسخ السكربت</button>
                <a
                    class="open-scriptblox"
                    id="open"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    فتح ScriptBlox
                </a>
            </div>

        </div>

    </div>

</div>

<footer>
    Powered by <span>ScriptBlox.com</span>
</footer>

<script>
const API="https://scriptblox.com/api/script/search";
const RAW_API="https://scriptblox.com/api/script/raw/";
const SITE="https://scriptblox.com";
const FALLBACK="https://raw.githubusercontent.com/Rxz60/404/refs/heads/main/IMG_5190.jpeg";

const results=document.getElementById("results");
const loading=document.getElementById("loading");
const empty=document.getElementById("empty");
const resultCount=document.getElementById("resultCount");
const resultTitle=document.getElementById("resultTitle");
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const modalGame=document.getElementById("modalGame");
const code=document.getElementById("code");
const close=document.getElementById("close");
const copy=document.getElementById("copy");
const open=document.getElementById("open");

let scripts=[];
let filter="all";
let current="";

const safe=x=>String(x??"").replace(/[&<>"']/g,x=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
}[x]));

const views=x=>{
    const n=Number(x||0);
    if(n>=1000000)return(n/1000000).toFixed(1)+"M";
    if(n>=1000)return(n/1000).toFixed(1)+"K";
    return n;
};

const hasKey=x=>
    x.key===true ||
    x.key==="true" ||
    x.hasKey===true ||
    x.hasKey==="true";

const isVerified=x=>
    x.verified===true ||
    x.verified==="true";

const isPatched=x=>
    x.isPatched===true ||
    x.isPatched==="true" ||
    x.patched===true ||
    x.patched==="true";

const scriptImage=x=>{
    const value=x.image;
    if(typeof value==="string" && value.trim()){
        return value;
    }
    return FALLBACK;
};

const gameImage=x=>{
    const game=x.game||{};

    if(typeof game.imageUrl==="string" && game.imageUrl.trim()){
        return game.imageUrl;
    }

    if(typeof game.image==="string" && game.image.trim()){
        return game.image;
    }

    return FALLBACK;
};

const gameName=x=>{
    if(typeof x.game==="string")return x.game;
    return x.game?.name || "Unknown Game";
};

const match=x=>{
    if(filter==="all")return true;

    if(filter==="free"){
        return !hasKey(x);
    }

    if(filter==="key"){
        return hasKey(x);
    }

    if(filter==="verified"){
        return isVerified(x);
    }

    if(filter==="patched"){
        return isPatched(x);
    }

    return true;
};

const tags=x=>{
    let html="";

    if(isVerified(x)){
        html+='<span class="tag green">✓ VERIFIED</span>';
    }

    if(hasKey(x)){
        html+='<span class="tag orange">KEY</span>';
    }else{
        html+='<span class="tag">FREE</span>';
    }

    if(isPatched(x)){
        html+='<span class="tag">PATCHED</span>';
    }

    if(x.isUniversal){
        html+='<span class="tag">UNIVERSAL</span>';
    }

    return html;
};

const render=()=>{
    const list=scripts.filter(match);

    results.innerHTML="";

    resultCount.textContent=list.length+" سكربت";

    if(!list.length){
        empty.style.display="block";
        return;
    }

    empty.style.display="none";

    list.forEach((x,index)=>{

        const image=scriptImage(x);
        const game=gameName(x);
        const title=x.title || "Unnamed Script";
        const id=x._id || x.slug || String(index);
        const type=x.scriptType || "Lua";

        const card=document.createElement("article");
        card.className="card";

        card.innerHTML=`
            <div class="card-image">
                <img
                    src="${safe(image)}"
                    alt="${safe(title)}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.onerror=null;this.src='${FALLBACK}'"
                >
                <div class="type">${safe(type)}</div>
            </div>

            <div class="card-body">

                <div class="card-title">${safe(title)}</div>

                <div class="game-name">${safe(game)}</div>

                <div class="tags">
                    ${tags(x)}
                </div>

                <div class="card-footer">

                    <div class="views">
                        👁 ${views(x.views)}
                    </div>

                    <button class="open-btn">
                        عرض السكربت
                    </button>

                </div>

            </div>
        `;

        card.querySelector(".open-btn").onclick=()=>{
            modal.classList.add("show");

            modalTitle.textContent=title;
            modalGame.textContent=game;
            code.textContent="جاري تحميل السكربت...";
            current="";

            open.href=x.slug
                ? SITE+"/script/"+encodeURIComponent(x.slug)
                : SITE;

            const rawUrl=RAW_API+encodeURIComponent(x.slug || x._id || "");

            fetch(rawUrl)
                .then(r=>r.text())
                .then(t=>{
                    let value=t;

                    try{
                        const parsed=JSON.parse(t);
                        value=
                            parsed?.script ||
                            parsed?.result?.script ||
                            parsed?.result?.script?.script ||
                            t;
                    }catch(e){}

                    current=String(value||"");

                    if(!current){
                        current=x.script || "السكربت غير متوفر.";
                    }

                    code.textContent=current;
                })
                .catch(()=>{
                    current=x.script || "تعذر تحميل السكربت.";
                    code.textContent=current;
                });
        };

        results.appendChild(card);
    });
};

const load=async(q="")=>{
    loading.style.display="flex";
    empty.style.display="none";
    results.innerHTML="";
    resultCount.textContent="جاري التحميل...";

    try{
        const query=q.trim() || "roblox";
        const url=API+"?q="+encodeURIComponent(query)+"&max=20";

        const response=await fetch(url,{
            method:"GET",
            headers:{
                "Accept":"application/json"
            }
        });

        if(!response.ok){
            throw new Error("API ERROR");
        }

        const data=await response.json();

        scripts=
            data?.result?.scripts ||
            data?.scripts ||
            [];

        resultTitle.textContent=
            q.trim()
            ? "نتائج البحث"
            : "أحدث السكربتات";

        filter="all";

        document.querySelectorAll(".filter").forEach(x=>{
            x.classList.toggle(
                "active",
                x.dataset.filter==="all"
            );
        });

        render();

    }catch(e){

        scripts=[];

        empty.style.display="block";

        empty.innerHTML=`
            <h2>تعذر تحميل السكربتات</h2>
            <p>تأكد من اتصال الإنترنت ثم حاول مرة ثانية</p>
        `;

        resultCount.textContent="خطأ";

    }finally{
        loading.style.display="none";
    }
};

form.onsubmit=e=>{
    e.preventDefault();
    load(input.value);
    window.scrollTo({
        top:document.querySelector(".container").offsetTop-80,
        behavior:"smooth"
    });
};

document.querySelectorAll(".filter").forEach(button=>{
    button.onclick=()=>{
        document.querySelectorAll(".filter").forEach(x=>{
            x.classList.remove("active");
        });

        button.classList.add("active");

        filter=button.dataset.filter;

        render();
    };
});

close.onclick=()=>{
    modal.classList.remove("show");
};

modal.onclick=e=>{
    if(e.target===modal){
        modal.classList.remove("show");
    }
};

document.onkeydown=e=>{
    if(e.key==="Escape"){
        modal.classList.remove("show");
    }
};

copy.onclick=async()=>{
    if(!current)return;

    try{
        await navigator.clipboard.writeText(current);

        copy.textContent="تم النسخ ✓";

        setTimeout(()=>{
            copy.textContent="نسخ السكربت";
        },1500);

    }catch(e){

        const area=document.createElement("textarea");
        area.value=current;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();

        copy.textContent="تم النسخ ✓";

        setTimeout(()=>{
            copy.textContent="نسخ السكربت";
        },1500);
    }
};

load();
</script>
